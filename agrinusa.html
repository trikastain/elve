<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgriNusa ERP — Sistem Terintegrasi Pupuk (Enterprise)</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#0f172a; --ink2:#475569; --muted:#94a3b8;
    --line:#e6ebf2; --brand:#16a34a; --brand-d:#15803d; --brand-l:#dcfce7;
    --blue:#0ea5e9; --amber:#f59e0b; --red:#ef4444; --violet:#8b5cf6; --cyan:#06b6d4;
    --sidebar:#0b1220; --sidebar-2:#111b2e;
    --r:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:20px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8;background-clip:content-box}

  .app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}

  /* Sidebar */
  .sidebar{
    background:linear-gradient(180deg,var(--sidebar) 0%,var(--sidebar-2) 100%);
    color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;
  }
  .brand{display:flex;gap:11px;align-items:center;padding:20px 18px 14px}
  .brand-logo{
    width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    background:linear-gradient(140deg,#22c55e,#0ea5e9);display:grid;place-items:center;
    font-size:19px;box-shadow:0 6px 18px -6px rgba(34,197,94,.8)
  }
  .brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
  .brand small{display:block;color:#7d8ba3;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
  .nav{padding:6px 10px 18px;flex:1}
  .nav-group{margin-top:14px}
  .nav-group>span{
    display:block;padding:0 12px 7px;font-size:10.5px;letter-spacing:.9px;
    text-transform:uppercase;color:#5b6b85;font-weight:700
  }
  .nav-item{
    display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;
    color:#b9c6d9;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;
    font-size:13px;transition:.16s;position:relative;margin-bottom:1px
  }
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:rgba(34,197,94,.14);color:#fff}
  .nav-item.active::before{
    content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
    background:var(--brand);border-radius:0 3px 3px 0
  }
  .nav-item i{font-style:normal;font-size:15px;width:20px;text-align:center;filter:saturate(.9)}
  .nav-item .tag{
    margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
    padding:1px 6px;border-radius:20px
  }
  .side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#64748b}
  .side-foot b{color:#cbd5e1;display:block;font-size:12px}

  /* Main */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{
    position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap
  }
  .hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}
  .page-title h1{margin:0;font-size:18px;letter-spacing:-.3px}
  .page-title p{margin:1px 0 0;color:var(--muted);font-size:12px}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{
    display:flex;align-items:center;gap:8px;background:#f1f5f9;border:1px solid transparent;
    border-radius:10px;padding:8px 12px;min-width:220px;transition:.16s
  }
  .search:focus-within{background:#fff;border-color:#bbf7d0;box-shadow:0 0 0 3px rgba(34,197,94,.12)}
  .search input{border:0;background:transparent;outline:0;width:100%;font-size:13px}
  .icon-btn{
    border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;
    display:grid;place-items:center;cursor:pointer;position:relative;transition:.16s
  }
  .icon-btn:hover{border-color:#cbd5e1;background:#f8fafc}
  .icon-btn .dot{
    position:absolute;top:7px;right:8px;width:8px;height:8px;background:var(--red);
    border-radius:50%;border:2px solid #fff
  }
  .user{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:30px;background:#fff}
  .avatar{
    width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#22c55e,#0ea5e9);
    color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px
  }
  .user small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
  .user b{font-size:12.5px;line-height:1.2}

  .content{padding:20px 24px 44px;flex:1}

  /* Sub-nav */
  .subnav{
    display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#fff;
    border:1px solid var(--line);border-radius:12px;margin-bottom:16px;
    box-shadow:var(--shadow)
  }
  .subnav-item{
    border:1px solid transparent;background:#f8fafc;color:#475569;padding:7px 13px;
    border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:650;transition:.16s;
    display:flex;align-items:center;gap:6px;white-space:nowrap
  }
  .subnav-item:hover{background:#eef2f7;color:#0f172a}
  .subnav-item.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px -4px rgba(22,163,74,.7)}
  .subnav-item .sn-ic{font-size:13px;opacity:.9}

  /* Grid & Cards */
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(206px,1fr))}
  .kpis-sm{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .cols-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .cols-3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
  .cols-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .span-2{grid-column:span 2}
  @media(max-width:1100px){.span-2{grid-column:span 1}}

  .kpi{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden
  }
  .kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--brand);opacity:.9}
  .kpi.blue::after{background:var(--blue)} .kpi.amber::after{background:var(--amber)}
  .kpi.red::after{background:var(--red)} .kpi.violet::after{background:var(--violet)}
  .kpi.cyan::after{background:var(--cyan)}
  .kpi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .kpi-label{font-size:11.5px;color:var(--ink2);font-weight:650;letter-spacing:.2px}
  .kpi-ic{font-size:16px;opacity:.85}
  .kpi-val{font-size:23px;font-weight:750;letter-spacing:-.8px;margin:6px 0 4px}
  .kpi-foot{display:flex;align-items:center;gap:8px;font-size:11px;flex-wrap:wrap}
  .delta{font-weight:700;padding:2px 7px;border-radius:20px;font-size:10.5px}
  .delta.up{color:#15803d;background:var(--brand-l)}
  .delta.down{color:#b91c1c;background:#fee2e2}
  .muted{color:var(--muted)}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column
  }
  .card-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .card-hd h3{margin:0;font-size:13.5px;letter-spacing:-.2px}
  .card-hd .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card-bd{padding:15px 16px;flex:1}
  .card-bd.tight{padding:8px 12px}
  .card-bd.flush{padding:0}

  .chip{
    font-size:11px;padding:4px 10px;border-radius:20px;background:#f1f5f9;color:var(--ink2);
    border:1px solid var(--line);cursor:pointer;font-weight:600
  }
  .chip.active{background:var(--brand-l);color:var(--brand-d);border-color:#bbf7d0}

  .chart-wrap{position:relative;width:100%;height:238px}
  .chart-wrap.sm{height:190px}
  .chart-wrap.lg{height:290px}
  canvas{display:block;width:100%;height:100%}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink2)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

  .tbl-wrap{overflow:auto;max-height:440px}
  table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  table.tbl thead th{
    position:sticky;top:0;background:#f8fafc;text-align:left;padding:10px 13px;
    font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#64748b;
    border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;z-index:1
  }
  table.tbl td{padding:10px 13px;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap}
  table.tbl tbody tr:hover{background:#f8fafc}
  table.tbl tbody tr:last-child td{border-bottom:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .neg{color:#dc2626} .pos{color:#15803d}

  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    padding:3px 9px;border-radius:20px;white-space:nowrap
  }
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.ok{background:#dcfce7;color:#15803d}
  .badge.warn{background:#fef3c7;color:#b45309}
  .badge.bad{background:#fee2e2;color:#b91c1c}
  .badge.info{background:#e0f2fe;color:#0369a1}
  .badge.idle{background:#f1f5f9;color:#64748b}

  .gauge{
    width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:0 auto;
    background:conic-gradient(var(--c,#16a34a) calc(var(--p)*1%),#eef2f7 0)
  }
  .gauge-in{width:98px;height:98px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
  .gauge-in b{font-size:21px;letter-spacing:-.6px;display:block}
  .gauge-in span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

  .progress{height:7px;background:#eef2f7;border-radius:20px;overflow:hidden;min-width:80px}
  .progress>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#22c55e,#16a34a)}
  .progress.blue>i{background:linear-gradient(90deg,#38bdf8,#0ea5e9)}
  .progress.amber>i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
  .progress.red>i{background:linear-gradient(90deg,#f87171,#ef4444)}

  .list{display:flex;flex-direction:column;gap:2px}
  .list-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #f1f5f9}
  .list-row:last-child{border-bottom:0}
  .list-row .ic{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:#f1f5f9;font-size:15px;flex:0 0 auto
  }
  .list-row .tx{flex:1;min-width:0}
  .list-row .tx b{display:block;font-size:12.5px;font-weight:600}
  .list-row .tx small{color:var(--muted);font-size:11px}
  .list-row .rt{text-align:right;font-size:11.5px}

  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #eef2f7;font-size:12.5px;gap:10px}
  .stat-row:last-child{border-bottom:0}
  .stat-row b{font-variant-numeric:tabular-nums}

  .form-grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
    background:#fff;outline:0;transition:.16s;font-size:12.5px
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:#86efac;box-shadow:0 0 0 3px rgba(34,197,94,.13)
  }
  .btn{
    border:0;border-radius:10px;padding:9px 15px;font-weight:650;font-size:12.5px;cursor:pointer;transition:.16s
  }
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px -6px rgba(22,163,74,.7)}
  .btn.primary:hover{background:var(--brand-d)}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
  .btn.ghost:hover{background:#f8fafc}

  .callout{
    display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;
    background:#fffbeb;border:1px solid #fde68a;font-size:12px;color:#92400e
  }
  .callout.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
  .callout.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
  .callout.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}

  .fade{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .mini-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;z-index:60;width:262px;transform:translateX(-100%);transition:.25s}
    .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(15,23,42,.45)}
    .hamb{display:block}
    .content{padding:14px 12px 40px}
    .topbar{padding:11px 14px}
    .search{min-width:0;width:100%;order:5}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🌱</div>
      <div><b>AgriNusa</b><small>Fertilizer ERP</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <b>Periode: Okt 2026</b>
      Sinkron terakhir 5 menit lalu
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="hamb" id="hamb">☰</button>
      <div class="page-title">
        <h1 id="pTitle">Dashboard</h1>
        <p id="pSub">Ringkasan operasional perusahaan</p>
      </div>
      <div class="topbar-right">
        <div class="search">🔎 <input placeholder="Cari batch, PO, karyawan..." /></div>
        <button class="icon-btn" title="Notifikasi">🔔<span class="dot"></span></button>
        <button class="icon-btn" title="Bantuan">❔</button>
        <div class="user">
          <div class="avatar">BS</div>
          <div><b>Budi Santoso</b><small>Plant Manager</small></div>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* =========================================================
   UTILITAS
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const num = n => (n ?? 0).toLocaleString('id-ID');
const rp  = n => 'Rp ' + num(Math.round(n));
const pct = n => n.toFixed(1) + '%';

function fmtShort(v){
  const a = Math.abs(v);
  if(a >= 1e12) return (v/1e12).toFixed(1).replace('.',',') + ' T';
  if(a >= 1e9)  return (v/1e9).toFixed(1).replace('.',',')  + ' M';
  if(a >= 1e6)  return (v/1e6).toFixed(1).replace('.',',')  + ' jt';
  if(a >= 1e3)  return Math.round(v/1e3) + ' rb';
  return String(Math.round(v));
}
const hexA = (hex,a) => {
  const n = parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
};

function kpi({label, value, delta, sub, icon='', tone=''}){
  const d = (delta === undefined || delta === null) ? '' :
    `<span class="delta ${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(1).replace('.',',')}%</span>`;
  return `<div class="kpi ${tone}">
    <div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-ic">${icon}</span></div>
    <div class="kpi-val">${value}</div>
    <div class="kpi-foot">${d}<span class="muted">${sub||''}</span></div>
  </div>`;
}
function kpiRow(items){ return `<div class="grid kpis">${items.map(kpi).join('')}</div>`; }

function card(title, body, opts={}){
  return `<section class="card ${opts.cls||''}">
    <header class="card-hd"><h3>${title}</h3>${opts.actions?`<div class="actions">${opts.actions}</div>`:''}</header>
    <div class="card-bd ${opts.pad||''}">${body}</div>
  </section>`;
}
function table(headers, rows){
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}
function legend(items){
  return `<div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${i.label}</span>`).join('')}</div>`;
}
function badge(text, type='ok'){ return `<span class="badge ${type}">${text}</span>`; }
function progress(v, cls=''){ return `<div class="progress ${cls}"><i style="width:${Math.min(100,v)}%"></i></div>`; }
function statRow(label, val){ return `<div class="stat-row"><span>${label}</span><b>${val}</b></div>`; }
function callout(type, title, text){
  const ic = type==='ok'?'✅':type==='bad'?'⛔':type==='info'?'ℹ️':'⚠️';
  return `<div class="callout ${type}"><span>${ic}</span><div><b>${title}</b><br>${text}</div></div>`;
}

/* =========================================================
   CHART ENGINE (Canvas, tanpa library)
   ========================================================= */
function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width  = Math.max(1, r.width  * dpr);
  cv.height = Math.max(1, r.height * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  return { ctx, w:r.width, h:r.height };
}
function roundRect(ctx,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function axes(ctx,w,h,pad,max,min=0){
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  ctx.font = '10.5px ui-sans-serif,system-ui';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const y = pad.t + ch*i/4;
    ctx.strokeStyle = i===4 ? '#cbd5e1' : '#eef2f7';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y+.5); ctx.lineTo(pad.l+cw, y+.5); ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(fmtShort(max - (max-min)*i/4), pad.l-9, y);
  }
  return { cw, ch };
}
function xLabels(ctx,labels,pad,cw,ch){
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#94a3b8';
  ctx.font='10.5px ui-sans-serif,system-ui';
  const step = labels.length > 10 ? Math.ceil(labels.length/8) : 1;
  labels.forEach((lb,i)=>{
    if(i % step) return;
    const x = pad.l + (labels.length>1 ? cw*i/(labels.length-1) : cw/2);
    ctx.fillText(lb, x, pad.t+ch+8);
  });
}
function lineChart(cv, labels, series, opts={}){
  const {ctx,w,h} = setupCanvas(cv);
  const pad = {l:52,r:16,t:14,b:28};
  const all = series.flatMap(s=>s.data);
  const min = opts.min0 === false ? Math.min(...all)*0.92 : 0;
  let max = Math.max(...all);
  max = max + (max-min)*0.16 || 1;
  const {cw,ch} = axes(ctx,w,h,pad,max,min);
  xLabels(ctx,labels,pad,cw,ch);
  series.forEach(s=>{
    const pts = s.data.map((v,i)=>({
      x: pad.l + (s.data.length>1 ? cw*i/(s.data.length-1) : cw/2),
      y: pad.t + ch*(1-(v-min)/(max-min))
    }));
    if(s.fill !== false){
      const g = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
      g.addColorStop(0, hexA(s.color,.26));
      g.addColorStop(1, hexA(s.color,0));
      ctx.beginPath(); ctx.moveTo(pts[0].x, pad.t+ch);
      pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x, pad.t+ch);
      ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    }
    ctx.beginPath();
    pts.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.strokeStyle = s.color; ctx.lineWidth = 2.3;
    ctx.lineJoin='round'; ctx.lineCap='round';
    if(s.dash) ctx.setLineDash([6,5]); else ctx.setLineDash([]);
    ctx.stroke(); ctx.setLineDash([]);
    pts.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2);
      ctx.fillStyle='#fff'; ctx.fill();
      ctx.strokeStyle=s.color; ctx.lineWidth=1.8; ctx.stroke();
    });
  });
}
function barChart(cv, labels, series, opts={}){
  const {ctx,w,h} = setupCanvas(cv);
  const pad = {l:52,r:16,t:14,b:28};
  const max = Math.max(...series.flatMap(s=>s.data))*1.18 || 1;
  const {cw,ch} = axes(ctx,w,h,pad,max,0);
  const groupW = cw/labels.length;
  const barW = Math.min(30, (groupW*0.62)/series.length);
  labels.forEach((lb,i)=>{
    const gx = pad.l + groupW*i + groupW/2;
    series.forEach((s,j)=>{
      const v = s.data[i] || 0;
      const bh = ch*(v/max);
      const x = gx - (barW*series.length)/2 + j*barW;
      const y = pad.t + ch - bh;
      const g = ctx.createLinearGradient(0,y,0,pad.t+ch);
      g.addColorStop(0, s.color);
      g.addColorStop(1, hexA(s.color,.5));
      ctx.fillStyle = g;
      roundRect(ctx, x, y, Math.max(2,barW-4), bh, 4);
      ctx.fill();
    });
    ctx.fillStyle='#94a3b8'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font='10.5px ui-sans-serif,system-ui';
    ctx.fillText(lb, gx, pad.t+ch+8);
  });
}
function donutChart(cv, data, opts={}){
  const {ctx,w,h} = setupCanvas(cv);
  const cx = w/2, cy = h/2;
  const R = Math.min(w,h)/2 - 6;
  const r = R * 0.63;
  const total = data.reduce((a,b)=>a+b.value,0) || 1;
  let ang = -Math.PI/2;
  data.forEach(d=>{
    const a = d.value/total * Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,R,ang,ang+a);
    ctx.arc(cx,cy,r,ang+a,ang,true);
    ctx.closePath();
    ctx.fillStyle = d.color; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    ang += a;
  });
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#0f172a';
  ctx.font = '700 19px ui-sans-serif,system-ui';
  ctx.fillText(opts.center ?? fmtShort(total), cx, cy - 7);
  ctx.font = '10.5px ui-sans-serif,system-ui';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(opts.sub ?? 'Total', cx, cy + 12);
}
function stackedBar(cv, labels, series){
  const {ctx,w,h} = setupCanvas(cv);
  const pad = {l:52,r:16,t:14,b:28};
  const totals = labels.map((_,i)=> series.reduce((a,s)=>a+(s.data[i]||0),0));
  const max = Math.max(...totals)*1.15 || 1;
  const {cw,ch} = axes(ctx,w,h,pad,max,0);
  const groupW = cw/labels.length;
  const barW = Math.min(38, groupW*0.6);
  labels.forEach((lb,i)=>{
    const gx = pad.l + groupW*i + groupW/2 - barW/2;
    let acc = 0;
    series.forEach(s=>{
      const v = s.data[i]||0;
      const bh = ch*(v/max);
      const y = pad.t + ch - acc - bh;
      ctx.fillStyle = s.color;
      roundRect(ctx, gx, y, barW, Math.max(0,bh), 3);
      ctx.fill();
      acc += bh;
    });
    ctx.fillStyle='#94a3b8'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font='10.5px ui-sans-serif,system-ui';
    ctx.fillText(lb, gx+barW/2, pad.t+ch+8);
  });
}

/* =========================================================
   ROUTER & RENDER
   ========================================================= */
const NAV_ORDER = ['Utama','Divisi','Sistem'];

function buildNav(){
  const nav = $('#nav');
  nav.innerHTML = NAV_ORDER.map(group => {
    const items = Object.entries(PAGES).filter(([,p]) => p.group === group);
    if(!items.length) return '';
    return `<div class="nav-group"><span>${group}</span>
      ${items.map(([id,p]) => `
        <button class="nav-item" data-page="${id}">
          <i>${p.icon}</i>${p.title}
          ${id==='k3' ? '<span class="tag">1</span>' : ''}
        </button>`).join('')}
    </div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      navigate(btn.dataset.page);
      $('#sidebar').classList.remove('open');
    });
  });
}
function updateNavActive(){
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
}

let currentPage = 'dashboard';
let currentSub = 'overview';

function renderSubNav(pageId){
  const p = PAGES[pageId];
  if(!p.subs) return '';
  const active = SUB_STATE[pageId] || Object.keys(p.subs)[0];
  return `<div class="subnav">${Object.entries(p.subs).map(([id,s])=>`
    <button class="subnav-item ${id===active?'active':''}" data-sub="${id}">
      ${s.icon?`<span class="sn-ic">${s.icon}</span>`:''}${s.title}
    </button>
  `).join('')}</div>`;
}

function navigate(id, subId){
  if(!PAGES[id]) return;
  currentPage = id;
  const p = PAGES[id];

  $('#pTitle').textContent = p.title;
  $('#pSub').textContent = p.sub;

  // Tentukan sub aktif
  if(!SUB_STATE[id]) SUB_STATE[id] = Object.keys(p.subs)[0];
  if(subId) SUB_STATE[id] = subId;
  const activeSubId = SUB_STATE[id];
  const sub = p.subs[activeSubId];

  const content = $('#content');
  content.innerHTML = renderSubNav(id) + `<div id="subcontent">${sub.render()}</div>`;

  // Attach subnav listeners
  content.querySelectorAll('.subnav-item').forEach(btn => {
    btn.addEventListener('click', () => navigate(id, btn.dataset.sub));
  });

  content.classList.remove('fade');
  void content.offsetWidth;
  content.classList.add('fade');

  updateNavActive();
  window.scrollTo({top:0, behavior:'smooth'});

  requestAnimationFrame(() => { try{ sub.after && sub.after(); }catch(e){ console.warn(e); } });
}

/* Resize → redraw chart sub aktif */
let rz;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    try{
      const p = PAGES[currentPage];
      const sub = p.subs[SUB_STATE[currentPage]];
      sub.after && sub.after();
    }catch(e){}
  }, 180);
});

$('#hamb').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

/* Init */
buildNav();
navigate('dashboard');
</script>
