<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Elvenium Grup — Integrated Multi-Company</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b1220;
    --panel: #131c2e;
    --panel-2: #1b2740;
    --panel-3: #24324f;
    --text: #e6edf7;
    --muted: #8ba0bf;
    --accent: #10b981;
    --accent-2: #3b82f6;
    --warn: #f59e0b;
    --danger: #ef4444;
    --purple: #a855f7;
    --border: #2a3a58;
    --radius: 12px;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #16233c 0%, var(--bg) 60%);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 285px;
    background: linear-gradient(180deg, #101a2e 0%, #0d1526 100%);
    border-right: 1px solid var(--border);
    padding: 18px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .brand .logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #059669);
    display: grid; place-items: center;
    font-size: 21px;
    box-shadow: 0 6px 18px rgba(16,185,129,.35);
    flex-shrink: 0;
  }
  .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: .2px; line-height: 1.2; }
  .brand small { display: block; color: var(--muted); font-size: 10.5px; font-weight: 500; margin-top: 2px; }

  .section-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    padding: 10px 10px 6px;
    font-weight: 600;
  }

  .company-switch { display: grid; gap: 6px; margin-bottom: 12px; }
  .company-switch button {
    display: flex; align-items: flex-start; gap: 10px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    text-align: left;
    transition: all .18s ease;
    font-family: inherit;
    line-height: 1.25;
  }
  .company-switch button:hover { background: var(--panel-2); color: var(--text); }
  .company-switch button.active {
    background: linear-gradient(90deg, rgba(16,185,129,.16), rgba(59,130,246,.08));
    border-color: rgba(16,185,129,.35);
    color: #fff;
  }
  .company-switch button .ico { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .company-switch button .co-sub { display: block; font-size: 10px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .company-switch button.active .co-sub { color: #a7f3d0; }

  .modules { display: grid; gap: 3px; margin-top: 6px; }
  .modules a {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 12px;
    border-radius: 9px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    border-left: 2px solid transparent;
  }
  .modules a:hover { background: var(--panel-2); color: var(--text); }
  .modules a.active {
    background: var(--panel-2);
    color: #fff;
    border-left-color: var(--accent);
  }
  .modules a .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .modules a.active .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .sidebar-footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .sidebar-footer button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all .15s;
  }
  .sidebar-footer button:hover { color: var(--text); border-color: var(--accent); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    padding: 22px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(13,21,38,.6);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 20;
    gap: 16px;
    flex-wrap: wrap;
  }
  .topbar h2 { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .topbar p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .topbar .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(16,185,129,.12);
    color: var(--accent);
    border: 1px solid rgba(16,185,129,.3);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .topbar .badge .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(16,185,129,.6);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,.6); }
    70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  .view { padding: 24px 32px 60px; }

  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
  @media (max-width: 1200px) {
    .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 820px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }

  .card {
    background: linear-gradient(180deg, var(--panel) 0%, #111a2b 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .card h3 {
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card h3 .sub { color: var(--muted); font-size: 11.5px; font-weight: 500; }
  .card .hint { color: var(--muted); font-size: 11.5px; margin-bottom: 14px; }

  .kpi {
    padding: 18px;
    border-radius: var(--radius);
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .kpi::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity:.9;
  }
  .kpi .label { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .kpi .value { font-size: 24px; font-weight: 800; margin: 8px 0 4px; letter-spacing: -.5px; }
  .kpi .delta { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .kpi .delta.up { color: var(--accent); }
  .kpi .delta.down { color: var(--danger); }
  .kpi .delta.flat { color: var(--warn); }
  .kpi.blue::before { background: linear-gradient(90deg, var(--accent-2), #60a5fa); }
  .kpi.purple::before { background: linear-gradient(90deg, var(--purple), #ec4899); }
  .kpi.warn::before { background: linear-gradient(90deg, var(--warn), #f97316); }

  .chart-box { position: relative; height: 290px; margin-top: 8px; }
  .chart-box.sm { height: 230px; }
  .chart-box.lg { height: 340px; }

  .table-wrap { overflow-x: auto; margin-top: 10px; border-radius: 10px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--panel-3); }
  th {
    text-align: left;
    padding: 11px 14px;
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    white-space: nowrap;
  }
  td { padding: 11px 14px; border-top: 1px solid var(--border); }
  tbody tr:hover { background: rgba(59,130,246,.05); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill.ok { background: rgba(16,185,129,.15); color: #34d399; }
  .pill.warn { background: rgba(245,158,11,.15); color: #fbbf24; }
  .pill.bad { background: rgba(239,68,68,.15); color: #f87171; }
  .pill.info { background: rgba(59,130,246,.15); color: #60a5fa; }
  .pill.neutral { background: rgba(148,163,184,.15); color: #cbd5e1; }
  .pill.purple { background: rgba(168,85,247,.15); color: #c084fc; }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(16,185,129,.12);
    color: #34d399;
    font-size: 10.5px;
    font-weight: 600;
    border: 1px solid rgba(16,185,129,.25);
    margin-left: 6px;
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 14px;
    padding: 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .form-row input, .form-row select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 11px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border .15s;
    width: 100%;
  }
  .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
  .form-row button {
    background: linear-gradient(135deg, var(--accent), #059669);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform .1s;
  }
  .form-row button:hover { transform: translateY(-1px); }
  .form-row button.ghost { background: var(--panel-3); color: var(--text); }

  .btn-del {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 26px; height: 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
  }
  .btn-del:hover { color: var(--danger); border-color: var(--danger); }

  .progress {
    height: 8px;
    border-radius: 999px;
    background: var(--panel-3);
    overflow: hidden;
    margin-top: 8px;
  }
  .progress > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px;
    transition: width .5s ease;
  }
  .progress.warn > span { background: linear-gradient(90deg, var(--warn), #f97316); }
  .progress.bad > span { background: linear-gradient(90deg, var(--danger), #dc2626); }

  .empty {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 13px;
  }
  .row-flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .big { font-size: 22px; font-weight: 700; }

  .info-banner {
    background: linear-gradient(90deg, rgba(59,130,246,.1), rgba(168,85,247,.08));
    border: 1px solid rgba(59,130,246,.25);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .info-banner b { color: #fff; }
</style>
</head>

</div>

const DATA_KEY = 'erp_elvenium_v2';

const state = {
  company: 'holding',
  module: 'exec',
  data: loadData()
};

function loadData() {
  try {
    const raw = localStorage.getItem(DATA_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData() {
  try { localStorage.setItem(DATA_KEY, JSON.stringify(state.data)); } catch(e) {}
}
function resetData() {
  if (!confirm('Reset semua data ke contoh awal?')) return;
  state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();
  render();
}
function exportData() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'erp-elvenium-data.json';
  a.click();
  URL.revokeObjectURL(url);
}

const charts = {};
Chart.defaults.color = '#8ba0bf';

Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
Chart.defaults.font.size = 11.5;

function makeChart(id, config) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  charts[id] = new Chart(ctx, config);
}
function destroyAllCharts() {
  Object.keys(charts).forEach(k => { try { charts[k].destroy(); } catch(e){} delete charts[k]; });
}

/* ============================================================
   RENDER PIPELINE
============================================================ */
function setCompany(co) {
  state.company = co;
  if (!MODULES[co].find(m => m.id === state.module)) {
    state.module = MODULES[co][0].id;
  }
  render();
}
function setModule(m) {
  state.module = m;
  render();
}

function render() {
  destroyAllCharts();
  renderSidebar();
  renderTopbar();
  renderContent();
}

function renderSidebar() {
  document.querySelectorAll('#companySwitch button').forEach(b => {
    b.classList.toggle('active', b.dataset.co === state.company);
  });
  const nav = document.getElementById('modules');
  nav.innerHTML = MODULES[state.company].map(m => `
    <a data-mod="${m.id}" class="${m.id === state.module ? 'active' : ''}">
      <span class="dot"></span>${m.label}
    </a>
  `).join('');
}

function renderTopbar() {
  const meta = COMPANY_META[state.company];
  const mod = MODULES[state.company].find(m => m.id === state.module);
  document.getElementById('pageTitle').textContent = mod ? mod.label : 'Dashboard';
  document.getElementById('pageSub').textContent = meta.name + ' · ' + meta.desc;
}

function renderContent() {
  const view = document.getElementById('view');
  const key = state.company + ':' + state.module;
  const fn = VIEWS[key];
  if (!fn) { view.innerHTML = '<div class="empty">Modul tidak ditemukan.</div>'; return; }
  view.innerHTML = fn();
  const hook = HOOKS[key];
  if (hook) hook();
}

/* ============================================================
   HELPERS
============================================================ */
function kpiCard(label, value, delta, deltaClass, extraClass='') {
  return `
    <div class="kpi ${extraClass}">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
      ${delta ? `<div class="delta ${deltaClass}">${delta}</div>` : ''}
    </div>`;
}
function healthPill(h) {
  const map = {'Baik':'ok','Cukup':'warn','Perlu Perhatian':'bad'};
  return `<span class="pill ${map[h] || 'neutral'}">${h}</span>`;
}
function statusPill(s) {
  const m = {
    'Selesai':'ok','Aktif':'ok','Lulus':'ok','Lunas':'ok',
    'Dalam Perjalanan':'info','Terjadwal':'info','Negosiasi':'info',
    'Revisi':'warn','Belum Bayar':'warn','Servis':'warn',
    'Gagal':'bad'
  };
  return `<span class="pill ${m[s] || 'neutral'}">${s}</span>`;
}
function komoditasPill(k) {
  const m = {'Gamal':'ok','Kaliandra':'info','Akasia':'warn','Lamtoro':'neutral'};
  return `<span class="pill ${m[k] || 'neutral'}">${k}</span>`;
}

function computeTotals() {
  const d = state.data;
  const totalReal = d.production.reduce((a,b)=>a+b.realisasi,0);
  const totalTarget = d.production.reduce((a,b)=>a+b.target,0);
  const totalPLN = d.production.reduce((a,b)=>a+b.toPLN,0);
  const totalExport = d.production.reduce((a,b)=>a+b.toExport,0);
  const revPLN = totalPLN * PRICE.PLN;
  const revExport = totalExport * PRICE.EXPORT;
  const totalRev = revPLN + revExport;
  const totalCost = d.production.reduce((a,b)=>a+b.realisasi*b.cogm,0);
  return {totalReal, totalTarget, totalPLN, totalExport, revPLN, revExport, totalRev, totalCost};
}

  const total = d.services.reduce((a,b)=>a+b.nilai,0);
  const plnSvc = d.services.filter(s=>s.jenis.includes('PLN') || s.klien.includes('PLN')).reduce((a,b)=>a+b.nilai,0);
  const expSvc = d.services.filter(s=>s.jenis.toLowerCase().includes('export')).reduce((a,b)=>a+b.nilai,0);
  return `
    <div class="grid grid-4" style="margin-bottom:18px">
      ${kpiCard('Total Kontrak', d.services.length, '', 'flat')}
      ${kpiCard('Nilai Kontrak', fmt.rpShort(total), '', 'flat', 'blue')}
      ${kpiCard('Nilai PLN', fmt.rpShort(plnSvc), 'Kontrak offtake utama', 'flat', 'purple')}
      ${kpiCard('Nilai Export', fmt.rpShort(expSvc), 'Jepang & Korea', 'flat', 'warn')}
    </div>

    <div class="card">
      <h3>Layanan Agribisnis & Kontrak</h3>
      <div class="hint">Kontrak suplai pellet, export, kerjasama Perhutani, layanan pendampingan tani, sewa alat, dan jasa borongan.</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Klien</th><th>Jenis Layanan</th><th class="num">Nilai</th><th>Periode</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${d.services.map(s => `
              <tr>
                <td><b>${s.klien}</b></td>
                <td>${s.jenis}</td>
                <td class="num">${fmt.rpShort(s.nilai)}</td>
                <td>${s.periode}</td>
                <td>${statusPill(s.status)}</td>
                <td><button class="btn-del" onclick="delRow('services',${s.id})">✕</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <div class="form-row">
        <input id="sKlien" placeholder="Klien">
        <input id="sJenis" placeholder="Jenis layanan">
        <input id="sNilai" type="number" placeholder="Nilai (Rp)">
        <input id="sPeriode" placeholder="Periode (mis. Des 2024)">
        <select id="sStatus"><option>Aktif</option><option>Selesai</option></select>
        <button onclick="addService()">+ Tambah</button>
      </div>
    </div>
  `;
};
window.addService = function() {
  const klien = document.getElementById('sKlien').value.trim();
  const jenis = document.getElementById('sJenis').value.trim();
  const nilai = parseFloat(document.getElementById('sNilai').value) || 0;
  const periode = document.getElementById('sPeriode').value.trim();
  const status = document.getElementById('sStatus').value;
  if (!klien) { alert('Klien wajib diisi.'); return; }
  const id = Math.max(0, ...state.data.services.map(p=>p.id)) + 1;
  state.data.services.push({id, klien, jenis, nilai, periode, status});
  saveData(); render();
};

  return `

      <div>
        <b>PT Elvenium Agro Inovasi</b> · Pabrik wood pellet Cikembar, Sukabumi ·

    <div class="grid grid-2" style="margin-bottom:18px">
      <div class="card">
        <h3>Fluktuasi Kadar Air & Nilai Kalori <span class="sub">per Batch</span></h3>

      </div>
      <div class="card">
        <h3>OEE & Conversion Rate Bulanan</h3>

window.addProd = function() {
  const bulan = document.getElementById('prBulan').value.trim();
  const target = parseFloat(document.getElementById('prTarget').value) || 0;
  const realisasi = parseFloat(document.getElementById('prReal').value) || 0;
  const toPLN = parseFloat(document.getElementById('prPLN').value) || 0;
  const toExport = parseFloat(document.getElementById('prExp').value) || 0;
  const cogm = parseFloat(document.getElementById('prCogm').value) || 0;
  if (!bulan) { alert('Bulan wajib diisi.'); return; }
  state.data.production.push({bulan, target, realisasi, toPLN, toExport, cogm, conversion:0.65, oee:80});
  saveData(); render();
};

  return `
    <div class="grid grid-3" style="margin-bottom:18px">
      ${kpiCard('Total Maintenance', d.maintenance.length, 'Catatan', 'flat')}
      ${kpiCard('Total Downtime', totalDown+' jam', 'Akumulasi', 'flat', 'warn')}

    </div>

    <div class="card" style="margin-bottom:18px">
      <h3>Perawatan Mesin (Maintenance)</h3>
      <div class="hint">Pemeliharaan chipper, hammer mill, dryer, dan pellet mill untuk meminimalisir downtime.</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Mesin</th><th>Tanggal</th><th>Jenis</th><th class="num">Downtime (jam)</th><th class="num">Biaya</th><th>Teknisi</th><th></th></tr></thead>
          <tbody>
            ${d.maintenance.map(m => `
              <tr>
                <td><b>${m.mesin}</b></td>
                <td>${m.tanggal}</td>
                <td>${m.jenis==='Preventif' ? '<span class="pill info">Preventif</span>' : '<span class="pill warn">Korektif</span>'}</td>
                <td class="num">${m.downtime}</td>
                <td class="num">${fmt.rp(m.biaya)}</td>
                <td>${m.teknisi}</td>
                <td><button class="btn-del" onclick="delRow('maintenance',${m.id})">✕</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <div class="form-row">
        <select id="mMesin"><option>Chipper</option><option>Hammer Mill</option><option>Dryer</option><option>Pellet Mill</option></select>
        <input id="mTgl" type="date" value="${new Date().toISOString().slice(0,10)}">
        <select id="mJenis"><option>Preventif</option><option>Korektif</option></select>
        <input id="mDown" type="number" placeholder="Downtime (jam)">
        <input id="mBiaya" type="number" placeholder="Biaya (Rp)">
        <input id="mTeknisi" placeholder="Teknisi">
        <button onclick="addMaint()">+ Tambah</button>
      </div>
    </div>

    <div class="card">
      <h3>Downtime per Mesin</h3>
      <div class="chart-box"><canvas id="chMaint"></canvas></div>
    </div>
  `;
};
HOOKS['plant:maintenance'] = () => {
  const d = state.data;
  const byMesin = {};
  d.maintenance.forEach(m => byMesin[m.mesin] = (byMesin[m.mesin]||0) + m.downtime);
  makeChart('chMaint', {
    type:'bar',
    data:{
      labels: Object.keys(byMesin),
      datasets:[{label:'Downtime (jam)', data:Object.values(byMesin), backgroundColor:'rgba(239,68,68,.75)', borderRadius:6}]
    },
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, grid:{color:'rgba(42,58,88,.4)'}}, x:{grid:{display:false}}}}
  });
};
window.addMaint = function() {
  const mesin = document.getElementById('mMesin').value;
  const tanggal = document.getElementById('mTgl').value;
  const jenis = document.getElementById('mJenis').value;
  const downtime = parseFloat(document.getElementById('mDown').value) || 0;
  const biaya = parseFloat(document.getElementById('mBiaya').value) || 0;
  const teknisi = document.getElementById('mTeknisi').value.trim();
  const id = Math.max(0, ...state.data.maintenance.map(p=>p.id)) + 1;
  state.data.maintenance.push({id, mesin, tanggal, jenis, downtime, biaya, teknisi});
  saveData(); render();
};

   PLANT — QC
============================================================ */

  const d = state.data;
  const avgMoist = d.qc.reduce((a,b)=>a+b.moisture,0)/d.qc.length;
  const avgKal = d.qc.reduce((a,b)=>a+b.kalori,0)/d.qc.length;

    <div class="grid grid-4" style="margin-bottom:18px">
      ${kpiCard('Total Batch', d.qc.length, '', 'flat')}
      ${kpiCard('Lulus QC', lulus+' batch', `${fmt.pct(lulus/d.qc.length*100)}`, 'up', 'blue')}

    <div class="card" style="margin-bottom:18px">
      <h3>Quality Control — Uji Laboratorium</h3>
      <div class="hint">Kadar air (moisture), kadar abu, density, dan nilai kalori per batch — plus tujuan pengiriman (PLN/Export).</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Batch</th><th>Tanggal</th><th class="num">Moisture (%)</th><th class="num">Kalori (kCal/kg)</th><th class="num">Abu (%)</th><th class="num">Density</th><th>Tujuan</th><th>Status</th><th></th></tr></thead>

            ${d.qc.map(q => `
              <tr>
                <td><b>${q.id}</b></td>
                <td>${q.tanggal}</td>
                <td class="num" style="color:${q.moisture<10?'#34d399':'#f87171'}">${q.moisture.toFixed(1)}</td>

    <div class="card">
      <h3>Sebaran Kadar Air vs Nilai Kalori</h3>
      <div class="hint">Semakin rendah moisture, semakin tinggi nilai kalori — scatter plot per batch (warna = status QC).</div>
      <div class="chart-box"><canvas id="chQcScatter"></canvas></div>
    </div>
  `;
};
HOOKS['plant:qc'] = () => {
  const d = state.data;
  makeChart('chQcScatter', {
    type:'scatter',
    data:{
      datasets:[{
        label:'Batch',
        data: d.qc.map(q=>({x:q.moisture, y:q.kalori, id:q.id, tujuan:q.tujuan})),
        backgroundColor: d.qc.map(q=> q.status==='Lulus' ? 'rgba(16,185,129,.85)' : q.status==='Revisi' ? 'rgba(245,158,11,.85)' : 'rgba(239,68,68,.85)'),
        pointRadius:7, pointHoverRadius:10, borderColor:'#0b1220', borderWidth:2
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:c=>`${c.raw.id} (${c.raw.tujuan}): Moisture ${c.raw.x}% · Kalori ${fmt.num(c.raw.y)}`}}
      },
      scales:{
        x:{title:{display:true, text:'Moisture (%)'}, grid:{color:'rgba(42,58,88,.4)'}, min:6, max:13},
        y:{title:{display:true, text:'Kalori (kCal/kg)'}, grid:{color:'rgba(42,58,88,.4)'}, min:3800, max:4600}
      }
    }
  });
};
window.addQc = function() {
  const id = document.getElementById('qId').value.trim();
  const tanggal = document.getElementById('qTgl').value;
  const moisture = parseFloat(document.getElementById('qMoist').value) || 0;
  const kalori = parseFloat(document.getElementById('qKal').value) || 0;
  const abu = parseFloat(document.getElementById('qAbu').value) || 0;
  const density = parseFloat(document.getElementById('qDen').value) || 0;
  const tujuan = document.getElementById('qTujuan').value;
  const status = document.getElementById('qStatus').value;
  if (!id) { alert('Batch ID wajib diisi.'); return; }
  state.data.qc.push({id, tanggal, moisture, kalori, abu, density, tujuan, status});
  saveData(); render();
};

/* ============================================================
   INIT
============================================================ */
document.getElementById('companySwitch').addEventListener('click', e => {
  const b = e.target.closest('button[data-co]');
  if (b) setCompany(b.dataset.co);
});
document.getElementById('modules').addEventListener('click', e => {
  const a = e.target.closest('a[data-mod]');
  if (a) { e.preventDefault(); setModule(a.dataset.mod); }
});
document.getElementById('btnReset').addEventListener('click', resetData);
document.getElementById('btnExport').addEventListener('click', exportData);

render();
</script>
